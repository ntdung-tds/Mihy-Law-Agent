name: Platform Admin R262 response boundary
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_api_gpt.mjs'
      - 'tests/platform_response_limit_gpt.test.mjs'
      - '.github/workflows/platform-response-r262-gpt.yml'
  workflow_dispatch:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_response_limit_gpt.test.mjs
