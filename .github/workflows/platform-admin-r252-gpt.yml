name: platform-admin-r252-gpt
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'tests/platform_list_duplicate_gpt.test.mjs'
      - '.github/workflows/platform-admin-r252-gpt.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_list_duplicate_gpt.test.mjs
