name: F21 R201 review-state contract
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/src/f21_review_state_gpt.mjs'
      - 'deployment/cloudflare/tests/f21_review_state_gpt.test.mjs'
      - '.github/workflows/f21-r201-review-state-gpt.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/tests/f21_review_state_gpt.test.mjs
