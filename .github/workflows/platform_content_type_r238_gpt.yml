name: R238 platform JSON content-type boundary
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_http_gpt.mjs'
      - 'tests/platform_content_type_r238_gpt.test.mjs'
      - '.github/workflows/platform_content_type_r238_gpt.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_content_type_r238_gpt.test.mjs
