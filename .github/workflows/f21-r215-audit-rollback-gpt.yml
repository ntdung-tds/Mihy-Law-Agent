name: F21 R215 audit rollback contract
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/tests/test_r215_f21_audit_rollback_gpt.py'
      - 'deployment/cloudflare/tests/test_r213_f21_pending_review_gpt.py'
      - 'deployment/cloudflare/migrations/r213_f21_pending_review_gpt.sql'
      - '.github/workflows/f21-r215-audit-rollback-gpt.yml'
  workflow_dispatch:
jobs:
  audit-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s deployment/cloudflare/tests -p 'test_r215_f21_audit_rollback_gpt.py' -v
