name: Platform admin R226 plan metadata contract
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'deployment/cloudflare/tests/platform_admin_r226_gpt.test.mjs'
      - '.github/workflows/platform-admin-r226-gpt.yml'
  workflow_dispatch:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/tests/platform_admin_r226_gpt.test.mjs
