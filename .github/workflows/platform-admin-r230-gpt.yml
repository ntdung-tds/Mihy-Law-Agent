name: Platform Admin R230 expiry calendar
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'tests/platform_admin_r230_gpt.test.mjs'
      - '.github/workflows/platform-admin-r230-gpt.yml'
jobs:
  expiry-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_admin_r230_gpt.test.mjs
