name: platform-admin-r268-gpt
on:
  push:
    branches:
      - 'gpt/r268-platform-input-preflight'
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_http_gpt.mjs'
      - 'deployment/cloudflare/platform_admin_r268_gpt.test.mjs'
      - '.github/workflows/platform-admin-r268-gpt.yml'
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/platform_admin_r268_gpt.test.mjs
