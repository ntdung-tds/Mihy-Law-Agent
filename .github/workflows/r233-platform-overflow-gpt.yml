name: R233 Platform metadata list overflow
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'tests/platform_list_overflow_gpt.test.mjs'
      - '.github/workflows/r233-platform-overflow-gpt.yml'
  workflow_dispatch:
jobs:
  overflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_list_overflow_gpt.test.mjs
