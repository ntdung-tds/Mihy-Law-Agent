name: R217 platform admin service contract
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'deployment/cloudflare/tests/platform_admin_r217_gpt.test.mjs'
      - '.github/workflows/platform-admin-r217-gpt.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test deployment/cloudflare/tests/platform_admin_r217_gpt.test.mjs
