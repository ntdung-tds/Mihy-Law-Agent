name: F21 QA approval schema contracts

on:
  pull_request:
    paths:
      - 'deployment/cloudflare/migrations/r187_f21_approval_gpt.sql'
      - 'deployment/cloudflare/tests/test_r18*_f21*_gpt.py'
      - 'deployment/cloudflare/tests/test_r190_f21_audit_insert_gpt.py'
      - '.github/workflows/f21-schema-gpt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-sqlite:
    name: F21 synthetic SQLite approval invariants (not live D1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute F21 schema regressions R187-R190
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s deployment/cloudflare/tests -p 'test_r18*_f21*_gpt.py' -v
          python -m unittest discover -s deployment/cloudflare/tests -p 'test_r190_f21_audit_insert_gpt.py' -v
      - name: State scope of evidence
        run: echo 'Synthetic SQLite tests only. No D1 migration, session, MatterACL, lawyer UI, or Cloudflare signed-in E2E is validated.'
