name: platform-admin-r218-gpt
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_ui_gpt.mjs'
      - 'deployment/cloudflare/tests/platform_admin_r218_gpt.test.mjs'
      - '.github/workflows/platform-admin-r218-gpt.yml'
  workflow_dispatch:
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five UI safety and mobile contracts
        run: node --test deployment/cloudflare/tests/platform_admin_r218_gpt.test.mjs
