name: DOCX POC unit checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit checks
        run: python -m unittest discover -s tests -v

      - name: Validate R0 preview and synthetic demo JavaScript syntax
        run: |
          node --check web/r0-preview/app.js
          node --check web/r0-demo/app.js

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ai_law_r30_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_law_r30_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AI_LAW_TEST_PG_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/ai_law_r30_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test driver
        run: python -m pip install "psycopg[binary]==3.3.7" -r requirements-r0-auth.txt
      - name: Real PostgreSQL 16 RLS and IAM contract tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_r0_postgres_integration.py' -v
      - name: Real PostgreSQL demo customer membership and MatterACL tests
        run: python -m unittest discover -s tests -p 'test_r31_demo_customers.py' -v

  standalone-db:
    # Actual two isolated Docker Compose PostgreSQL16 installations.
    # This is infrastructure-only smoke, NOT a full app deployment/login test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Two real standalone installation DBs + isolation + restart
        run: bash deployment/standalone/smoke_isolation.sh

  standalone-api:
    # R37 actual two isolated API+Postgres16 containers and cryptographic JWT.
    # R37 test-only persisted fixtures, NOT actual IdP login or production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral fixture signing dependencies
        run: python -m pip install -r requirements-r0-auth.txt
      - name: Verify R37 smoke script syntax (without echoing secrets)
        run: bash -n deployment/standalone/smoke_api.sh
      - name: Real nonproduction standalone API HTTP + PG16 signed JWT isolation
        run: bash deployment/standalone/smoke_api.sh

  standalone-login:
    # Real HTTP email/password verification with isolated Argon2id test accounts.
    # Only disposable Docker+PG16; NOT a production-approved customer IdP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral password account hashing and JWT dependencies
        run: python -m pip install -r requirements-r0-auth.txt "argon2-cffi==25.1.0"
      - name: Validate isolated auth smoke script syntax
        run: bash -n deployment/standalone/smoke_api.sh
      - name: Test real isolated Argon2id logins, signed bearer, PostgreSQL session, ACL and signout
        run: R38_ENABLE=1 bash deployment/standalone/smoke_api.sh

  standalone-browser:
    # Real Chromium E2E: two locally isolated standalone installations.
    # No public port; no screenshots/passwords/tokens are uploaded to GitHub.
    # This is NONPRODUCTION test fixture UI, not released customer staging.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test crypto and Chromium Playwright
        run: |
          python -m pip install -r requirements-r0-auth.txt "argon2-cffi==25.1.0" "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Validate Bash test harness
        run: |
          bash -n deployment/standalone/smoke_api.sh
          bash -n deployment/standalone/smoke_login_extension.sh
      - name: Actual Chromium desktop+mobile login/tenant/ACL/logout against Docker PostgreSQL16
        run: R38_ENABLE=1 R39_ENABLE=1 bash deployment/standalone/smoke_api.sh

  standalone-qa:
    # R40 reusable QA credential bundle + actual Docker/Postgres16 account
    # provisioning and persistence. CI data destroyed when run completes;
    # not a customer-accessible, long-lived staging server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA hash and signed bearer test dependencies
        run: python -m pip install -r requirements-r0-auth.txt "argon2-cffi==25.1.0"
      - name: Check bash provisioning syntax
        run: bash -n deployment/standalone/smoke_qa.sh
      - name: Real 10-account QA role provisioning, signed HTTP login, ACL, no-rotation, volume survival
        run: bash deployment/standalone/smoke_qa.sh

  standalone-staging-kit:
    # R41 tests operator-run, named-volume persistent-style standalone QA
    # packaging with 10 private TEMP CI accounts. CI still tears down all
    # resources: this does NOT deploy an Owner-accessible permanent server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone QA PostgreSQL/JWT/Argon2 and Chromium test dependencies
        run: |
          python -m pip install -r requirements-r0-auth.txt "argon2-cffi==25.1.0" "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Check strict operator and CI shell syntax
        run: |
          bash -n deployment/standalone/qa_staging.sh
          bash -n deployment/standalone/smoke_staging_kit.sh
      - name: Execute operator-style install, 10-account QA, Chromium mobile+desktop, restart without rekey
        run: R41_CI=disposable-docker-runner-only bash deployment/standalone/smoke_staging_kit.sh

  cloudflare-contract:
    # Nonproduction Worker/D1 contract regression. Does NOT deploy a Worker,
    # create a D1 database, connect Owner Google OAuth or run real Cloud D1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Cloudflare Worker JavaScript module syntax
        run: |
          node --check deployment/cloudflare/src/worker.mjs
          node --check deployment/cloudflare/src/google_drive.mjs
          node --check deployment/cloudflare/src/matter_workspace.mjs
          node --check deployment/cloudflare/src/r0_preview_worker.mjs
          node --check web/r0-preview/matters.js
          node --check tools/build_cf_r0_preview.mjs
          node --check deployment/cloudflare/src/site_worker.mjs
          node --check tools/build_cf_site.mjs
          node --check deployment/cloudflare/src/legacy_preview_redirect.mjs
          node --check web/website/site.js
          node --check web/website/login.js
      - name: Verify RS256 JWT, D1 authz fail-close and Google Drive adapter with fake credentials
        run: node --test deployment/cloudflare/tests/worker.test.mjs
      - name: Verify real WebCrypto PBKDF2 QA session cookies, mobile markup and CSRF
        run: node --test deployment/cloudflare/tests/mobile.test.mjs
      - name: Execute actual authz queries and FK/deny rules against SQLite
        run: python -m unittest discover -s deployment/cloudflare/tests -p 'test_sqlite_acl.py' -v
      - name: Verify unified R0 preview QA auth, CSRF, 11-function right rail (synthetic mocks)
        run: node --test deployment/cloudflare/tests/preview_worker.test.mjs
      - name: Verify real QA matter list/create role boundary and D1 transaction contract
        run: node --test deployment/cloudflare/tests/matter_workspace.test.mjs
      - name: Verify public website and protected workspace R47 routes
        run: node --test deployment/cloudflare/tests/site_worker.test.mjs
      - name: Guard customer-facing benefit claims and 320px layout fixes
        run: node --test deployment/cloudflare/tests/site_benefits.test.mjs
      - name: Verify Mihy Agent rebrand and two editorial landing pages
        run: node --test deployment/cloudflare/tests/site_landing_pages.test.mjs
      - name: Verify four long article routes, updated legal branding and company contacts
        run: node --test deployment/cloudflare/tests/site_editorial.test.mjs
      - name: Assert unified violet brand, compact mobile menu, hero no-wrap and full editorial scope
        run: node --test deployment/cloudflare/tests/site_visual_r52.test.mjs
      - name: Verify safe redirects from retired preview hostname
        run: node --test deployment/cloudflare/tests/legacy_redirect.test.mjs

  cloudflare-live-qa:
    # Only R43 feature branch: public nonproduction endpoint with ZERO secrets.
    # Does not verify login or Google Drive OAuth; only smoke + fail-closed API.
    if: github.ref_name == 'feat/r43-cloudflare-d1-authorization-and-drive-contract' || github.head_ref == 'feat/r43-cloudflare-d1-authorization-and-drive-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call real dedicated Cloudflare Free Worker over HTTPS and deny anonymous legal-file requests
        run: bash deployment/cloudflare/tests/live_http_smoke.sh

  cloudflare-mobile-live:
    # Real Cloudflare QA HTML/mobile Chrome test. No private QA password in CI.
    # Actual authenticated login must be checked with the private owner account.
    if: github.ref_name == 'feat/r44-cloudflare-mobile-qa-login' || github.head_ref == 'feat/r44-cloudflare-mobile-qa-login'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Real HTTPS Cloudflare login page Chromium 320/390/430/1440 + invalid credentials
        run: python deployment/cloudflare/tests/live_mobile_browser.py

  cloudflare-preview-live:
    # R45 only: live Cloudflare preview QA login screen and anonymous denial;
    # authorized workspace menu tested locally in Chromium with synthetic UI.
    if: github.ref_name == 'feat/r45-r0-preview-login-right-menu' || github.head_ref == 'feat/r45-r0-preview-login-right-menu'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: HTTPS live login denial and mobile right-rail Chromium
        run: python deployment/cloudflare/tests/live_r0_preview_browser.py

  cloudflare-preview-fast-smoke:
    if: github.ref_name == 'feat/r45-r0-preview-login-right-menu' || github.head_ref == 'feat/r45-r0-preview-login-right-menu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live HTTPS health, login UI, anonymous denial and CSRF (no credentials)
        run: |
          set -euo pipefail
          for base in "https://ai-law-r0-preview-r45-qa.iaict-platform.workers.dev" "https://ai-law-r0-preview.iaict-platform.workers.dev"; do
            echo "Checking configured QA and original R0 preview: $base"
            test "$(curl -sSL --max-time 25 -o /tmp/ai-law-health -w '%{http_code}' "$base/health")" = 200
            grep -q 'qa_only' /tmp/ai-law-health
            test "$(curl -sSL --max-time 25 -o /tmp/ai-law-login -w '%{http_code}' "$base/?utm_source=chatgpt.com")" = 200
            grep -q 'id="login-form"' /tmp/ai-law-login
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$base/app.js")" = 401
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$base/api/qa/session")" = 401
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://attacker.invalid' -H 'Content-Type: application/json' -d '{}' "$base/api/qa/logout")" = 403
          done

  cloudflare-matter-browser:
    # R46 real Chromium UI test with isolated synthetic HTTP API; D1 SQL separately tested.
    if: github.ref_name == 'feat/r46-real-matter-workspace-cloudflare-d1' || github.head_ref == 'feat/r46-real-matter-workspace-cloudflare-d1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Test R46 matter UI create/list/reload with real browser, no secrets
        run: python deployment/cloudflare/tests/live_r46_matter_browser.py

  cloudflare-matter-live:
    # R46 isolated QA Worker only; no password or legal client data in GitHub.
    if: github.ref_name == 'feat/r46-real-matter-workspace-cloudflare-d1' || github.head_ref == 'feat/r46-real-matter-workspace-cloudflare-d1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real live Cloudflare/D1 QA anonymous denial and same-origin preview gate
        run: |
          set -euo pipefail
          backend="https://ai-law-standalone-cf-qa.iaict-platform.workers.dev"
          preview="https://ai-law-r0-preview-r46-qa.iaict-platform.workers.dev"
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$backend/health")" = 200
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$backend/api/qa/matters")" = 401
          test "$(curl -sS --max-time 25 -o /tmp/r46-login -w '%{http_code}' "$preview/#documents")" = 200
          grep -q 'id="login-form"' /tmp/r46-login
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$preview/matters.js")" = 401
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$preview/api/qa/matters")" = 401
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.invalid' -H 'Content-Type: application/json' -d '{"title":"Synthetic QA"}' "$preview/api/qa/matters")" = 403

  cloudflare-site-live:
    # R47 only: website QA public homepage and protected-login mobile browser smoke.
    # Never accesses Owner passwords or uploads images to GitHub.
    if: github.ref_name == 'feat/r47-public-website-ai-law-web' || github.head_ref == 'feat/r47-public-website-ai-law-web'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for live Cloudflare QA website
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify staging and final website names across 4 viewport sizes
        run: |
          python deployment/cloudflare/tests/live_ai_law_website.py
          AI_LAW_WEBSITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_ai_law_website.py

  cloudflare-site-redirect:
    if: github.ref_name == 'feat/r47-public-website-ai-law-web' || github.head_ref == 'feat/r47-public-website-ai-law-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable public website and legacy preview bridge over real HTTPS
        run: |
          set -euo pipefail
          old="https://ai-law-r0-preview.iaict-platform.workers.dev"
          new="https://ai-law-web.iaict-platform.workers.dev"
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$old/")" = 308
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$old/?utm_source=chatgpt.com")" = 308
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$old/app")" = 308
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$old/api/qa/matters")" = 410
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$old/api/qa/login")" = 410
          curl -sS --max-time 25 -D /tmp/ai-law-legacy-headers -o /dev/null "$old/"
          grep -iF "Location: $new/" /tmp/ai-law-legacy-headers
          test "$(curl -sS --max-time 25 -o /tmp/ai-law-site-home -w '%{http_code}' "$new/")" = 200
          grep -q 'id="hero-title"' /tmp/ai-law-site-home
          grep -q 'class="site-footer"' /tmp/ai-law-site-home
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$new/login")" = 200
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$new/app")" = 302
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$new/app.js")" = 401
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$new/api/qa/matters")" = 401

  cloudflare-site-benefits:
    # R48 only: actual browser visual text and bounding-box overflow checks.
    # No screenshots or real customer data are uploaded to GitHub.
    if: github.ref_name == 'feat/r48-mobile-homepage-benefits-20261105' || github.head_ref == 'feat/r48-mobile-homepage-benefits-20261105'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify staging and primary website visual geometry at 11 viewport widths
        run: |
          python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
          AI_LAW_WEBSITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py

  cloudflare-site-mihiagent:
    # R49 only: browser verification on nonproduction QA staging after staged upload.
    # Do not assume a SaaS service, prices, credentials or production readiness.
    if: github.ref_name == 'feat/r49-mihiagent-two-offerings-20261105' || github.head_ref == 'feat/r49-mihiagent-two-offerings-20261105'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify two MihiAgent delivery cards, navigation and mobile boundaries at 11 widths
        run: |
          python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
          AI_LAW_WEBSITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py

  cloudflare-site-mihy-brand:
    # R50: only public nonproduction preview. Tests staging AND primary QA URL.
    # Protected workspace unchanged; no credentials, screenshots or client legal data.
    if: github.ref_name == 'feat/r50-mihy-rebrand-dual-landings-20261105' || github.head_ref == 'feat/r50-mihy-rebrand-dual-landings-20261105'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Test rebranded public homepage across 11 sizes on staging
        run: python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
      - name: Test both 9-section Mihy Agent landing pages across 11 sizes on staging
        run: python deployment/cloudflare/tests/live_mihy_brand_landings.py
      - name: Test rebranded public homepage across 11 sizes on primary nonproduction QA
        run: AI_LAW_WEBSITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
      - name: Test both landing pages across 11 sizes on primary nonproduction QA
        run: MIHY_SITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_mihy_brand_landings.py

  cloudflare-site-r51:
    # R51 only. Two Cloudflare NONPRODUCTION QA Workers; no login secrets or legal files.
    if: github.ref_name == 'feat/r51-home-editorial-legal-brand-contact-20261105' || github.head_ref == 'feat/r51-home-editorial-legal-brand-contact-20261105'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium for mobile QA
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Live new homepage regression on QA staging and primary
        run: |
          python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
          AI_LAW_WEBSITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
      - name: Live two delivery pages and mobile links on QA staging and primary
        run: |
          python deployment/cloudflare/tests/live_mihy_brand_landings.py
          MIHY_SITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_mihy_brand_landings.py
      - name: Live four editorial landings, contacts and clipped-text tests on both QA Workers
        run: |
          python deployment/cloudflare/tests/live_mihy_editorials.py
          MIHY_SITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_mihy_editorials.py

  cloudflare-site-r52:
    # Dedicated R52 live Chromium QA on NONPRODUCTION Workers only.
    if: github.ref_name == 'feat/r52-visual-polish-violet-mobile-longforms-20261105' || github.head_ref == 'feat/r52-visual-polish-violet-mobile-longforms-20261105'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Check real staging R52 hero no-wrap, mobile UI and all six detailed landing pages
        run: python deployment/cloudflare/tests/live_mihy_visual_r52.py
      - name: Regression all 11 staging homepage widths
        run: python deployment/cloudflare/tests/live_ai_law_mobile_benefits.py
      - name: Regression 11 staging widths for private and subscription landings
        run: python deployment/cloudflare/tests/live_mihy_brand_landings.py
      - name: Regression 6 staging widths for 4 editorial pages
        run: python deployment/cloudflare/tests/live_mihy_editorials.py
      - name: Check real primary NONPRODUCTION QA R52 hero, menu and six pages
        run: MIHY_SITE_URL=https://ai-law-web.iaict-platform.workers.dev python deployment/cloudflare/tests/live_mihy_visual_r52.py
