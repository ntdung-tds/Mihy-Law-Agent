name: DOCX POC unit checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit checks
        run: python -m unittest discover -s tests -v

      - name: Validate R0 preview and synthetic demo JavaScript syntax
        run: |
          node --check web/r0-preview/app.js
          node --check web/r0-demo/app.js

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ai_law_r30_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_law_r30_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AI_LAW_TEST_PG_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/ai_law_r30_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test driver
        run: python -m pip install "psycopg[binary]==3.3.7" -r requirements-r0-auth.txt
      - name: Real PostgreSQL 16 RLS and IAM contract tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_r0_postgres_integration.py' -v
      - name: Real PostgreSQL demo customer membership and MatterACL tests
        run: python -m unittest discover -s tests -p 'test_r31_demo_customers.py' -v

  standalone-db:
    # Actual two isolated Docker Compose PostgreSQL16 installations.
    # This is infrastructure-only smoke, NOT a full app deployment/login test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Two real standalone installation DBs + isolation + restart
        run: bash deployment/standalone/smoke_isolation.sh

  standalone-api:
    # R37 actual two isolated API+Postgres16 containers and cryptographic JWT.
    # R37 test-only persisted fixtures, NOT actual IdP login or production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral fixture signing dependencies
        run: python -m pip install -r requirements-r0-auth.txt
      - name: Verify R37 smoke script syntax (without echoing secrets)
        run: bash -n deployment/standalone/smoke_api.sh
      - name: Real nonproduction standalone API HTTP + PG16 signed JWT isolation
        run: bash deployment/standalone/smoke_api.sh

  standalone-login:
    # Real HTTP email/password verification with isolated Argon2id test accounts.
    # Only disposable Docker+PG16; NOT a production-approved customer IdP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral password account hashing and JWT dependencies
        run: python -m pip install -r requirements-r0-auth.txt "argon2-cffi==25.1.0"
      - name: Validate isolated auth smoke script syntax
        run: bash -n deployment/standalone/smoke_api.sh
      - name: Test real isolated Argon2id logins, signed bearer, PostgreSQL session, ACL and signout
        run: R38_ENABLE=1 bash deployment/standalone/smoke_api.sh
