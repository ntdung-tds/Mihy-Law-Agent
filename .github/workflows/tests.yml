name: DOCX POC unit checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit checks
        run: python -m unittest discover -s tests -v

      - name: Validate R0 preview and synthetic demo JavaScript syntax
        run: |
          node --check web/r0-preview/app.js
          node --check web/r0-demo/app.js

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ai_law_r30_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_law_r30_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AI_LAW_TEST_PG_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/ai_law_r30_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test driver
        run: python -m pip install "psycopg[binary]==3.3.7"
      - name: Real PostgreSQL 16 RLS and IAM contract tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_r0_postgres_integration.py' -v
      - name: Real PostgreSQL demo customer membership and MatterACL tests
        run: python -m unittest discover -s tests -p 'test_r31_demo_customers.py' -v
