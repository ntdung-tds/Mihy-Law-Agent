name: F21 R212 audit insertion integrity
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/migrations/r187_f21_approval_gpt.sql'
      - 'deployment/cloudflare/migrations/r212_f21_audit_insert_guard_gpt.sql'
      - 'deployment/cloudflare/tests/test_r212_f21_audit_insert_gpt.py'
      - '.github/workflows/f21-r212-audit-gpt.yml'
  workflow_dispatch:
jobs:
  audit-insert-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s deployment/cloudflare/tests -p 'test_r212_f21_audit_insert_gpt.py' -v
