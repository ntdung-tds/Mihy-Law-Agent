name: F21 R209 transition NFC guard
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/src/f21_approval_transition_gpt.mjs'
      - 'deployment/cloudflare/tests/r209_f21_transition_nfc_gpt.test.mjs'
      - '.github/workflows/f21-r209-nfc-gpt.yml'
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: R209 negative source contract (synthetic only)
        run: node --test deployment/cloudflare/tests/r209_f21_transition_nfc_gpt.test.mjs
