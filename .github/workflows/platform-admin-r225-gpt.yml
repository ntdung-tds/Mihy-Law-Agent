name: Platform Admin R225 audit integrity
on:
  push:
    branches:
      - 'agent/r225-platform-audit-gpt'
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'deployment/cloudflare/tests/platform_admin_r225_gpt.test.mjs'
      - '.github/workflows/platform-admin-r225-gpt.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/tests/platform_admin_r217_gpt.test.mjs deployment/cloudflare/tests/platform_admin_r225_gpt.test.mjs
