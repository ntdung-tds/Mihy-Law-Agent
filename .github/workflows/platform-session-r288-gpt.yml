name: Platform Worker session R288
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/**'
      - '.github/workflows/platform-session-r288-gpt.yml'
permissions:
  contents: read
jobs:
  platform-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/tests/platform_session_r288_gpt.test.mjs
      - run: python -m unittest discover -s deployment/cloudflare/tests -p test_r288_platform_session_gpt.py -v
