name: Platform Admin R222 contracts
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_api_gpt.mjs'
      - 'deployment/cloudflare/tests/platform_admin_r22*_gpt.test.mjs'
      - '.github/workflows/platform-admin-r222-gpt.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/tests/platform_admin_r221_gpt.test.mjs deployment/cloudflare/tests/platform_admin_r222_gpt.test.mjs
