name: F21 R195 approval state compatibility blocker
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/tests/r195_f21_state_contract_gpt.test.py'
      - 'deployment/cloudflare/migrations/r187_f21_approval_gpt.sql'
      - 'deployment/cloudflare/src/f21_approval_transition_gpt.mjs'
      - '.github/workflows/f21-r195-state-gpt.yml'
  workflow_dispatch:
jobs:
  synthetic-state-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce incompatible F21 states (synthetic, not D1)
        run: python3 -m unittest discover -s deployment/cloudflare/tests -p 'r195_f21_state_contract_gpt.test.py' -v
