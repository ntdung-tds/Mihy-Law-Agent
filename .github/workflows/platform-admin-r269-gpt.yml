name: platform-admin-r269-gpt
on:
  push:
    branches:
      - 'gpt/r269-platform-response-cap'
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_http_gpt.mjs'
      - 'deployment/cloudflare/platform_admin_r269_gpt.test.mjs'
      - '.github/workflows/platform-admin-r269-gpt.yml'
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/cloudflare/platform_admin_r269_gpt.test.mjs
