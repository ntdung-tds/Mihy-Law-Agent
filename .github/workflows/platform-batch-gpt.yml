name: platform batch result guard
on:
  pull_request:
    paths:
      - 'deployment/cloudflare/platform_admin_gpt.mjs'
      - 'tests/platform_batch_result_gpt.test.mjs'
      - '.github/workflows/platform-batch-gpt.yml'
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/platform_batch_result_gpt.test.mjs
